name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag matches package version and is ancestor of origin/main
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${VERSION}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag '$TAG' does not match expected tag '$EXPECTED_TAG' for package.json version '$VERSION'"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tagged commit $(git rev-parse HEAD) is not an ancestor of origin/main"
            exit 1
          fi

  checks:
    name: Checks
    needs: verify
    uses: ./.github/workflows/ci.yml

  package:
    name: Package
    needs: checks
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and package extension
        run: |
          VERSION="${TAG#v}"
          pnpm exec wxt zip
          ZIP="markdown-reader-${VERSION}-chrome.zip"
          ZIP_PATH=".output/${ZIP}"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "Expected $ZIP_PATH to exist"
            exit 1
          fi
          (cd .output && sha256sum "$ZIP" > "${ZIP}.sha256")
          mkdir -p dist-release
          cp "$ZIP_PATH" dist-release/
          cp "${ZIP_PATH}.sha256" dist-release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist-release/

  publish:
    name: Publish
    needs: [checks, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist-release
      - name: Create GitHub Release
        run: |
          VERSION="${TAG#v}"
          ZIP="dist-release/markdown-reader-${VERSION}-chrome.zip"
          SHA="dist-release/markdown-reader-${VERSION}-chrome.zip.sha256"
          gh release create "$TAG" "$ZIP" "$SHA" --verify-tag --generate-notes
